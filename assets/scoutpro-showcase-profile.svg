<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Perfil ilustrativo de atleta no ScoutPro</title>
  <desc id="desc">Tela fictícia de perfil de atleta com dados de carreira, posição e módulos de acompanhamento.</desc>
  <rect width="1200" height="650" fill="#f7f9f8"/><rect width="1200" height="78" fill="#173b3b"/><text x="45" y="47" fill="#ffffff" font-family="Arial" font-size="22" font-weight="700">ScoutPro</text><text x="1000" y="47" fill="#d5e5dc" font-family="Arial" font-size="15">Perfil demonstrativo</text>
  <rect x="50" y="112" width="1100" height="205" rx="18" fill="#203f3f"/><circle cx="155" cy="205" r="72" fill="#dcefd0" stroke="#84c225" stroke-width="5"/><text x="118" y="218" fill="#173b3b" font-family="Arial" font-size="39" font-weight="700">AE</text><text x="255" y="178" fill="#ffffff" font-family="Arial" font-size="28" font-weight="700">Atleta Exemplo</text><text x="255" y="209" fill="#b9d52d" font-family="Arial" font-size="16">Atacante · Clube Modelo · Divisão Nacional</text><text x="255" y="250" fill="#d5e5dc" font-family="Arial" font-size="16">Rating contextual</text><text x="255" y="290" fill="#84c225" font-family="Arial" font-size="38" font-weight="700">78</text><text x="315" y="287" fill="#d5e5dc" font-family="Arial" font-size="16">de 100</text><rect x="790" y="148" width="290" height="130" rx="14" fill="#2c5753"/><text x="820" y="183" fill="#b9d52d" font-family="Arial" font-size="15">Área de atuação</text><text x="820" y="235" fill="#ffffff" font-family="Arial" font-size="30" font-weight="700">ATA</text><text x="820" y="263" fill="#d5e5dc" font-family="Arial" font-size="14">Zona principal do atleta</text>
  <g font-family="Arial"><rect x="50" y="345" width="1100" height="54" rx="10" fill="#ffffff" stroke="#dce6ef"/><text x="92" y="379" fill="#173b3b" font-size="16" font-weight="700">Estatísticas</text><text x="287" y="379" fill="#6b7d78" font-size="16">Avaliações</text><text x="467" y="379" fill="#6b7d78" font-size="16">Vídeos</text><text x="623" y="379" fill="#6b7d78" font-size="16">Lesões</text><text x="790" y="379" fill="#6b7d78" font-size="16">Comentários</text><rect x="50" y="395" width="175" height="4" fill="#84c225"/>
    <rect x="50" y="433" width="530" height="165" rx="14" fill="#ffffff" stroke="#dce6ef"/><text x="80" y="470" fill="#173b3b" font-size="19" font-weight="700">Informações de carreira</text><text x="80" y="512" fill="#6b7d78" font-size="15">Clube</text><text x="420" y="512" fill="#173b3b" font-size="15" font-weight="700">Clube Modelo</text><text x="80" y="548" fill="#6b7d78" font-size="15">Jogos</text><text x="420" y="548" fill="#173b3b" font-size="15" font-weight="700">42</text><text x="80" y="584" fill="#6b7d78" font-size="15">Gols e assistências</text><text x="420" y="584" fill="#173b3b" font-size="15" font-weight="700">16</text>
    <rect x="615" y="433" width="535" height="165" rx="14" fill="#ffffff" stroke="#dce6ef"/><text x="645" y="470" fill="#173b3b" font-size="19" font-weight="700">Acompanhamento profissional</text><text x="645" y="512" fill="#6b7d78" font-size="15">Momento</text><text x="930" y="512" fill="#84c225" font-size="15" font-weight="700">Em evolução</text><text x="645" y="548" fill="#6b7d78" font-size="15">Registros</text><text x="930" y="548" fill="#173b3b" font-size="15" font-weight="700">Vídeos · notas · histórico</text><text x="645" y="584" fill="#6b7d78" font-size="15">Status</text><text x="930" y="584" fill="#173b3b" font-size="15" font-weight="700">Disponível</text>
  </g>
</svg>
