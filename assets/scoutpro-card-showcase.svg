<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cards demonstrativos do ScoutPro</title>
  <desc id="desc">Cards autorais de futebol com raridades elite, lendário e diamante. Os nomes são referências conceituais e os dados são ilustrativos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07151c"/><stop offset=".55" stop-color="#173b3b"/><stop offset="1" stop-color="#0a1018"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef7ff"/><stop offset=".45" stop-color="#8ca4bb"/><stop offset=".7" stop-color="#f8fbff"/><stop offset="1" stop-color="#536b82"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a6"/><stop offset=".3" stop-color="#d59c24"/><stop offset=".55" stop-color="#fff5bb"/><stop offset="1" stop-color="#9a5b09"/></linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7ffff"/><stop offset=".3" stop-color="#6be5e7"/><stop offset=".55" stop-color="#f5ffff"/><stop offset="1" stop-color="#6c7dff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#000" flood-opacity=".55"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8ce5d2" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="28" fill="url(#grid)"/>
  <circle cx="150" cy="135" r="120" fill="#84c225" opacity=".1" filter="url(#glow)"/><circle cx="1050" cy="560" r="160" fill="#6be5e7" opacity=".09" filter="url(#glow)"/>
  <text x="60" y="70" fill="#84c225" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">SCOUTPRO / PLAYER CARDS</text>
  <text x="60" y="115" fill="#f4fbf8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Raridade visual para comunicar o nível do atleta</text>
  <text x="60" y="145" fill="#b7c9bf" font-family="Arial, Helvetica, sans-serif" font-size="15">Demonstração conceitual, sem dados oficiais de avaliação.</text>
