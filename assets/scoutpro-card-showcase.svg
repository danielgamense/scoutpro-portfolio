    <path d="M18 126 155 38l137 88v208L155 417 18 334Z" fill="#ffd965" opacity=".17"/><path d="M38 90 155 26 272 90" fill="none" stroke="#fff0a6" stroke-width="2" opacity=".6"/>
    <circle cx="155" cy="181" r="78" fill="#e4ac38" opacity=".3" stroke="#fff0a6" stroke-width="4"/><text x="155" y="197" text-anchor="middle" fill="#fff4bf" font-size="52" font-weight="700">RG</text>
    <text x="25" y="48" fill="#fff4bf" font-size="46" font-weight="700">94</text><text x="28" y="69" fill="#ffe28b" font-size="13" font-weight="700">LENDÁRIO</text><text x="270" y="48" text-anchor="end" fill="#fff4bf" font-size="18" font-weight="700">MA</text>
    <text x="155" y="294" text-anchor="middle" fill="#fff9dc" font-size="25" font-weight="700">Ronaldinho G.</text><text x="155" y="320" text-anchor="middle" fill="#ffe28b" font-size="13">referência conceitual</text>
    <text x="44" y="365" fill="#fff5d0" font-size="14">DRIBLE</text><text x="266" y="365" text-anchor="end" fill="#fff9dc" font-size="16" font-weight="700">97</text><text x="44" y="392" fill="#fff5d0" font-size="14">TÉCNICA</text><text x="266" y="392" text-anchor="end" fill="#fff9dc" font-size="16" font-weight="700">96</text><text x="44" y="419" fill="#fff5d0" font-size="14">VISÃO</text><text x="266" y="419" text-anchor="end" fill="#fff9dc" font-size="16" font-weight="700">94</text>
    <text x="155" y="445" text-anchor="middle" fill="#ffe28b" font-size="13">★★★★★</text>
  </g>
  <g transform="translate(832 190)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
