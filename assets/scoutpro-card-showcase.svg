    <path d="M18 126 155 38l137 88v208L155 417 18 334Z" fill="#d8e6f3" opacity=".12"/>
    <circle cx="155" cy="181" r="76" fill="#b4c6d7" opacity=".25" stroke="#eff8ff" stroke-width="3"/><text x="155" y="197" text-anchor="middle" fill="#eff8ff" font-size="52" font-weight="700">CR</text>
    <text x="25" y="48" fill="#eff8ff" font-size="46" font-weight="700">88</text><text x="28" y="69" fill="#b9d7e5" font-size="13" font-weight="700">ELITE</text><text x="270" y="48" text-anchor="end" fill="#eff8ff" font-size="18" font-weight="700">ATA</text>
    <text x="155" y="294" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">Cristiano R.</text><text x="155" y="320" text-anchor="middle" fill="#b9d7e5" font-size="13">referência conceitual</text>
    <text x="44" y="365" fill="#eaf5f1" font-size="14">FINALIZAÇÃO</text><text x="266" y="365" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">91</text><text x="44" y="392" fill="#eaf5f1" font-size="14">VELOCIDADE</text><text x="266" y="392" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">89</text><text x="44" y="419" fill="#eaf5f1" font-size="14">FORÇA</text><text x="266" y="419" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">86</text>
    <text x="155" y="445" text-anchor="middle" fill="#b9d7e5" font-size="13">★★★★☆</text>
  </g>
