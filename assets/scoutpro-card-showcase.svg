    <path d="M18 126 155 38l137 88v208L155 417 18 334Z" fill="#63e7eb" opacity=".15"/><path d="m42 113 52-52 62 31 62-31 52 52-52 55 18 104-80 48-80-48 18-104Z" fill="none" stroke="#d7ffff" stroke-width="2" opacity=".5"/>
    <circle cx="155" cy="181" r="80" fill="#72e9ec" opacity=".23" stroke="#d7ffff" stroke-width="4"/><text x="155" y="197" text-anchor="middle" fill="#efffff" font-size="52" font-weight="700">P</text>
    <text x="25" y="48" fill="#efffff" font-size="46" font-weight="700">99</text><text x="28" y="69" fill="#b7ffff" font-size="13" font-weight="700">DIAMANTE</text><text x="270" y="48" text-anchor="end" fill="#efffff" font-size="18" font-weight="700">ATA</text>
    <text x="155" y="294" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">Pelé</text><text x="155" y="320" text-anchor="middle" fill="#b7ffff" font-size="13">referência conceitual</text>
    <text x="44" y="365" fill="#e9ffff" font-size="14">FINALIZAÇÃO</text><text x="266" y="365" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">99</text><text x="44" y="392" fill="#e9ffff" font-size="14">TÉCNICA</text><text x="266" y="392" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">98</text><text x="44" y="419" fill="#e9ffff" font-size="14">DECISÕES</text><text x="266" y="419" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">97</text>
    <text x="155" y="445" text-anchor="middle" fill="#b7ffff" font-size="13">★★★★★</text>
