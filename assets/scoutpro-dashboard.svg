<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Painel de scouting ScoutPro</title>
  <desc id="desc">Visualização conceitual de um painel com cards de atletas, posições, divisões e ratings.</desc>
  <rect width="1200" height="650" rx="24" fill="#f4f7f5"/>
  <rect width="1200" height="74" rx="24" fill="#1F3335"/>
  <text x="42" y="47" fill="#84C225" font-family="Arial" font-size="25" font-weight="700">SCOUTPRO</text>
  <text x="260" y="46" fill="#eaf2ed" font-family="Arial" font-size="18">Painel de atletas</text>
  <rect x="960" y="22" width="185" height="34" rx="17" fill="#2f5050"/>
  <text x="986" y="45" fill="#eaf2ed" font-family="Arial" font-size="14">Base de scouting</text>
  <text x="42" y="122" fill="#1F3335" font-family="Arial" font-size="28" font-weight="700">Atletas acompanhados</text>
  <text x="42" y="151" fill="#647271" font-family="Arial" font-size="16">Busca, comparação e contexto para cada avaliação</text>
  <rect x="42" y="180" width="1116" height="52" rx="12" fill="#ffffff" stroke="#d9e2dc"/>
  <text x="68" y="213" fill="#84918b" font-family="Arial" font-size="16">Buscar por nome, clube ou posição...</text>
  <g font-family="Arial">
    <rect x="42" y="268" width="350" height="300" rx="18" fill="#ffffff" stroke="#d9e2dc"/>
    <circle cx="96" cy="326" r="32" fill="#dcead0"/><text x="80" y="336" fill="#1F3335" font-size="18" font-weight="700">RM</text>
    <text x="145" y="318" fill="#1F3335" font-size="21" font-weight="700">Rafael Martins</text><text x="145" y="345" fill="#647271" font-size="15">ATA · Série B</text>
    <text x="70" y="403" fill="#647271" font-size="14">Rating contextual</text><text x="70" y="452" fill="#1F3335" font-size="56" font-weight="700">78</text><text x="144" y="449" fill="#84C225" font-size="15">de 100</text>
    <rect x="70" y="492" width="290" height="10" rx="5" fill="#e4ece6"/><rect x="70" y="492" width="226" height="10" rx="5" fill="#84C225"/>
    <text x="70" y="536" fill="#647271" font-size="14">Em alta · disponível</text>
    <rect x="425" y="268" width="350" height="300" rx="18" fill="#ffffff" stroke="#d9e2dc"/>
    <circle cx="479" cy="326" r="32" fill="#dcead0"/><text x="463" y="336" fill="#1F3335" font-size="18" font-weight="700">LC</text>
    <text x="528" y="318" fill="#1F3335" font-size="21" font-weight="700">Lucas Castro</text><text x="528" y="345" fill="#647271" font-size="15">MC · Série A</text>
    <text x="453" y="403" fill="#647271" font-size="14">Rating contextual</text><text x="453" y="452" fill="#1F3335" font-size="56" font-weight="700">84</text><text x="527" y="449" fill="#84C225" font-size="15">de 100</text>
    <rect x="453" y="492" width="290" height="10" rx="5" fill="#e4ece6"/><rect x="453" y="492" width="244" height="10" rx="5" fill="#84C225"/>
    <text x="453" y="536" fill="#647271" font-size="14">Estável · em observação</text>
    <rect x="808" y="268" width="350" height="300" rx="18" fill="#1F3335"/>
    <text x="838" y="320" fill="#eaf2ed" font-size="18" font-weight="700">Resumo da base</text>
    <text x="838" y="385" fill="#84C225" font-size="42" font-weight="700">128</text><text x="838" y="412" fill="#b7c9bf" font-size="14">atletas cadastrados</text>
    <text x="1010" y="385" fill="#84C225" font-size="42" font-weight="700">24</text><text x="1010" y="412" fill="#b7c9bf" font-size="14">priorizados</text>
    <line x1="838" y1="450" x2="1125" y2="450" stroke="#3d5d5b"/><text x="838" y="491" fill="#eaf2ed" font-size="15">Dados + avaliação + contexto</text><text x="838" y="523" fill="#b7c9bf" font-size="14">Uma visão organizada para decidir melhor</text>
  </g>
</svg>
